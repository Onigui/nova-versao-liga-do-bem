import groovy.json.JsonSlurper

def reactNativeVersion = new JsonSlurper()
        .parse(new File(rootDir, "../package.json"))
        .dependencies["react-native"]

if (reactNativeVersion?.startsWith("^") || reactNativeVersion?.startsWith("~")) {
    reactNativeVersion = reactNativeVersion.substring(1)
}

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.9.24"
        googlePlayServicesVersion = "21.5.0"
        firebaseVersion = "32.0.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.3.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects { subproject ->
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute(module("com.facebook.react:react-native"))
                .using(module("com.facebook.react:react-android:$reactNativeVersion"))
            substitute(module("com.facebook.react:hermes-engine"))
                .using(module("com.facebook.react:hermes-android:$reactNativeVersion"))
        }
    }

    if (subproject.name == "react-native-svg") {
        subproject.plugins.withId("com.android.library") {
            subproject.dependencies.add(
                "implementation",
                "com.google.code.findbugs:jsr305:3.0.2",
            )
        }
    }
}
