# Agendador gratuito (o plano Hobby da Vercel só tem cron diário). Os endpoints são públicos e
# idempotentes: só enviam o que já está na hora.
#  - notificações pagas aprovadas cujo horário chegou
#  - lembretes da próxima dose de vacina (o servidor só envia das 9h às 20h)
name: Agendador (notificações e lembretes)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Notificações pagas vencidas
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -X POST "https://nova-versao-liga-do-bem.vercel.app/api/cron/partner-push"
      - name: Lembretes de vacina
        if: always()
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -X POST "https://nova-versao-liga-do-bem.vercel.app/api/cron/vaccine-reminders"
