# Envia no horário as notificações pagas já aprovadas (o plano gratuito da Vercel não tem
# agendador frequente). O endpoint é público e idempotente: só envia o que já está na hora.
name: Notificações agendadas dos parceiros

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar envios vencidos
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -X POST "https://nova-versao-liga-do-bem.vercel.app/api/cron/partner-push"
