# RESERVA MANUAL. O agendador oficial agora roda no Supabase (pg_cron + pg_net, job
# "sociong-agendador", função public.sociong_agendador(), a cada 10 minutos), que é grátis e não
# depende do GitHub (nem dos minutos de Actions quando o repositório ficar privado).
# Este workflow só roda à mão ("Run workflow"), se o Supabase estiver fora do ar.
# Os endpoints são públicos e idempotentes: só enviam o que já está na hora.
#  - notificações pagas aprovadas cujo horário chegou
#  - lembretes da próxima dose de vacina (o servidor só envia das 9h às 20h)
name: Agendador (notificações e lembretes)

on:
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Notificações pagas vencidas
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -X POST "https://nova-versao-liga-do-bem.vercel.app/api/cron/partner-push"
      - name: Lembretes de vacina
        if: always()
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -X POST "https://nova-versao-liga-do-bem.vercel.app/api/cron/vaccine-reminders"
      - name: Pedidos de avaliação
        if: always()
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -X POST "https://nova-versao-liga-do-bem.vercel.app/api/cron/review-requests"
      - name: Achados e perdidos (expira avisos antigos)
        if: always()
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -X POST "https://nova-versao-liga-do-bem.vercel.app/api/cron/lostfound"
      - name: Resumo diário de pendências das ONGs (e-mail, uma vez por dia a partir das 8h)
        if: always()
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -X POST "https://nova-versao-liga-do-bem.vercel.app/api/platform-digest"
