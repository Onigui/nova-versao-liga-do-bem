name: 🚀 Build Android APK - Liga do Bem

on:
  push:
    branches:
      - master
      - main
    # Dispara sempre que houver push, mas só builda se houver mudanças no mobile
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Forçar build mesmo sem mudanças no mobile'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-changes:
    name: 🔍 Verificar mudanças
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: 🔍 Verificar mudanças
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/build-android.yml'

  build:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true' || github.event.inputs.force_build == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '34'
          target: 'default'
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true

      - name: 📦 Install dependencies
        working-directory: ./mobile
        run: |
          echo "📦 Instalando dependências..."
          npm ci --legacy-peer-deps
          echo "✅ Dependências instaladas!"

      - name: 🔑 Setup Release Keystore
        working-directory: ./mobile/android/app
        run: |
          echo "🔑 Criando keystore para assinatura..."
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore release.keystore \
            -alias ligadobem \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Liga do Bem, OU=Mobile, O=Liga do Bem Botucatu, L=Botucatu, ST=SP, C=BR"
          echo "✅ Keystore criado!"

      - name: 📝 Configure local.properties
        working-directory: ./mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 🏗️ Build APK
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: 📦 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: liga-do-bem-apk-build-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.2.3-build-${{ github.run_number }}
          name: Liga do Bem v1.2.3 Build ${{ github.run_number }}
          body: |
            ## 📱 Liga do Bem Botucatu - Build Automático
            
            ### ✨ Build Info
            - **Build**: ${{ github.run_number }}
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Data**: ${{ github.event.head_commit.timestamp }}
            
            ### ⬇️ Download:
            Baixe o APK abaixo e instale no seu dispositivo Android.
            
            **Android mínimo:** 6.0 (API 23)
          draft: false
          prerelease: false
          files: mobile/android/app/build/outputs/apk/release/*.apk

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🎯 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

