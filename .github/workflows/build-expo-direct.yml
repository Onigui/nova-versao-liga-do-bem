name: 🎯 Build APK com Expo (SEM EAS - 100% Gratuito)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/build-expo-direct.yml'

jobs:
  build:
    name: 📱 Build Direto com Expo
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        working-directory: ./mobile
        run: |
          echo "📦 Instalando dependências..."
          npm ci
          
          echo "📦 Instalando Expo CLI globalmente..."
          npm install -g expo-cli

      - name: 🔑 Setup Release Keystore
        if: github.event.inputs.build_type == 'release' || github.event_name == 'push'
        working-directory: ./mobile
        run: |
          echo "🔑 Criando keystore para assinatura..."
          
          mkdir -p android/app
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias ligadobem \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Liga do Bem, OU=Mobile, O=Liga do Bem Botucatu, L=Botucatu, ST=SP, C=BR"
          
          echo "✅ Keystore criado"

      - name: 🔧 Configure Gradle Properties
        working-directory: ./mobile/android
        run: |
          echo "🔧 Configurando gradle.properties..."
          cat >> gradle.properties << EOF
          
          # Configurações de assinatura do APK
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=ligadobem
          MYAPP_UPLOAD_STORE_PASSWORD=android
          MYAPP_UPLOAD_KEY_PASSWORD=android
          EOF
          
          echo "✅ Gradle configurado"

      - name: 🏗️ Build APK com Expo Run (SEM EAS!)
        working-directory: ./mobile
        run: |
          echo "🏗️ Iniciando build com Expo Run (GRATUITO, sem conta necessária)..."
          
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "📦 Building RELEASE APK com Expo..."
            
            # Garantir que a pasta android existe e está atualizada
            if [ ! -d "android/app/src" ]; then
              echo "📦 Gerando pasta android com expo prebuild..."
              npx expo prebuild --platform android --clean
            fi
            
            # Build release com Gradle direto
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
            
            # Copiar APK
            cp app/build/outputs/apk/release/app-release.apk ../../liga-do-bem-botucatu-v1.2.2.apk
            echo "✅ Release APK built successfully!"
          else
            echo "🐛 Building DEBUG APK..."
            
            # Build debug
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
            
            # Copiar APK
            cp app/build/outputs/apk/debug/app-debug.apk ../../liga-do-bem-botucatu-v1.2.2-debug.apk
            echo "✅ Debug APK built successfully!"
          fi
          
          echo "📦 APK gerado!"
          ls -lh ../../liga-do-bem-botucatu*.apk

      - name: 📦 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: liga-do-bem-apk-v1.2.2-build-${{ github.run_number }}
          path: |
            liga-do-bem-botucatu*.apk
          retention-days: 30

      - name: 🎉 Create GitHub Release
        if: github.event_name == 'push' || github.event.inputs.build_type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.2.2-expo-build-${{ github.run_number }}
          name: Liga do Bem v1.2.2 Build ${{ github.run_number }} (Expo Direct)
          body: |
            ## 📱 Liga do Bem Botucatu - Build Direto Expo
            
            ### ✨ Build Info
            - **Versão**: 1.2.2
            - **Build**: ${{ github.run_number }}
            - **Método**: Expo Prebuild + Gradle (100% GRATUITO!)
            - **Branch**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}
            
            ### 🎯 Vantagens:
            - ✅ **100% Gratuito** (sem conta Expo necessária)
            - ✅ **Sem EAS** (build local direto)
            - ✅ **Compatível** com estrutura Expo existente
            - ✅ **Rápido** (~10-15 minutos)
            
            ### 📥 Download
            Baixe o APK abaixo e instale no seu dispositivo Android.
          files: liga-do-bem-botucatu-v1.2.2.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🎯 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: Expo Direct (sem EAS!)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "liga-do-bem-botucatu-v1.2.2.apk" ]; then
            APK_SIZE=$(du -h liga-do-bem-botucatu-v1.2.2.apk | cut -f1)
            echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **APK gerado com Expo Prebuild + Gradle (100% gratuito)!**" >> $GITHUB_STEP_SUMMARY
          elif [ -f "liga-do-bem-botucatu-v1.2.2-debug.apk" ]; then
            APK_SIZE=$(du -h liga-do-bem-botucatu-v1.2.2-debug.apk | cut -f1)
            echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Debug APK gerado!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build falhou**" >> $GITHUB_STEP_SUMMARY
          fi
