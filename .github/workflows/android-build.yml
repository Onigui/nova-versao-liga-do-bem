name: Build Android APK

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.2.3)'
        required: false
        default: '1.2.3'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        working-directory: ./mobile
        run: |
          npm ci --legacy-peer-deps

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '34'
          target: 'default'
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          platforms: |
            android-34
          build-tools: |
            34.0.0
          ndk-version: |
            25.1.8937393

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            mobile/android/.gradle
            mobile/android/app/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Create local.properties
        working-directory: ./mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Release Keystore
        working-directory: ./mobile/android/app
        run: |
          echo "🔑 Criando keystore para assinatura..."
          
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore release.keystore \
            -alias ligadobem \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Liga do Bem, OU=Mobile, O=Liga do Bem Botucatu, L=Botucatu, ST=SP, C=BR"
          
          echo "✅ Keystore criado!"

      - name: Configure Gradle Properties
        working-directory: ./mobile/android
        run: |
          echo "📝 Configurando propriedades do Gradle para release..."
          # O caminho é relativo ao diretório do módulo app
          cat >> gradle.properties << EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD=android
          MYAPP_UPLOAD_KEY_ALIAS=ligadobem
          MYAPP_UPLOAD_KEY_PASSWORD=android
          EOF
          echo "✅ Propriedades configuradas!"
          echo "📋 Verificando gradle.properties:"
          grep -E "MYAPP_UPLOAD" gradle.properties || echo "⚠️ Propriedades não encontradas"

      - name: Clean Gradle
        working-directory: ./mobile/android
        run: ./gradlew clean --no-daemon

      - name: Verify Keystore
        working-directory: ./mobile/android/app
        run: |
          if [ -f "release.keystore" ]; then
            echo "✅ Keystore encontrado!"
            ls -lh release.keystore
          else
            echo "❌ Keystore não encontrado!"
            exit 1
          fi

      - name: Build APK
        working-directory: ./mobile/android
        run: |
          echo "🏗️ Iniciando build do APK..."
          echo "📋 Variáveis de ambiente:"
          echo "  ANDROID_HOME: $ANDROID_HOME"
          echo "  JAVA_HOME: $JAVA_HOME"
          echo "📋 Propriedades do Gradle:"
          grep -E "MYAPP_UPLOAD" gradle.properties || echo "⚠️ Propriedades não encontradas"
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ORG_GRADLE_DAEMON: false
          ORG_GRADLE_PARALLEL: true

      - name: Find APK
        id: find_apk
        working-directory: ./mobile/android
        run: |
          echo "🔍 Procurando APK gerado..."
          if [ -d "app/build/outputs/apk/release" ]; then
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -n "$APK_PATH" ]; then
              echo "✅ APK encontrado: $APK_PATH"
              echo "📦 Tamanho do APK:"
              ls -lh "$APK_PATH"
              echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            else
              echo "❌ Nenhum APK encontrado em app/build/outputs/apk/release"
              echo "📁 Conteúdo do diretório:"
              ls -la app/build/outputs/apk/release/ || echo "Diretório não existe"
              exit 1
            fi
          else
            echo "❌ Diretório app/build/outputs/apk/release não existe"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Get Version from package.json
        id: get_version
        working-directory: ./mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(node -p "require('./package.json').versionCode || '0'")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📦 Versão detectada: $VERSION (code: $VERSION_CODE)"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: mobile/android/app/build/outputs/apk/release/*.apk
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Liga do Bem v${{ steps.get_version.outputs.version }}
          body: |
            ## 📱 Liga do Bem Botucatu - Android APK
            
            **Versão:** ${{ steps.get_version.outputs.version }}
            **Version Code:** ${{ steps.get_version.outputs.version_code }}
            
            ### 📥 Download
            Baixe o APK anexado abaixo e instale no seu dispositivo Android.
            
            ### 🔄 Atualização Automática
            O aplicativo verifica automaticamente por atualizações e instala quando disponível.
            
            ---
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Build Date:** ${{ github.event.head_commit.timestamp || github.run_started_at }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Release URL
        run: |
          echo "✅ Release criado com sucesso!"
          echo "📦 Tag: v${{ steps.get_version.outputs.version }}"
          echo "🔗 URL do Release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.version }}"
          echo "📥 URL Direta do APK: https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.version }}/app-release.apk"
          echo ""
          echo "📋 PRÓXIMO PASSO:"
          echo "1. Acesse o painel admin"
          echo "2. Vá em 'Versões do App' > 'Nova Versão'"
          echo "3. Preencha:"
          echo "   - Versão: ${{ steps.get_version.outputs.version }}"
          echo "   - Version Code: ${{ steps.get_version.outputs.version_code }}"
          echo "   - Fonte: URL Externa"
          echo "   - URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.version }}/app-release.apk"
          echo "4. Salve a versão"

