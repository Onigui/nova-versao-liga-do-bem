name: 🚀 Build APK React Native 0.74.5 Nativo (100% Gratuito)

# Workflow restaurado e funcionando - dispara sempre no push

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - master
      - main
    # Sempre dispara no push - remove restrição de paths para garantir builds
  # PRs que mexem no app: valida o build ANTES do merge e deixa o APK como artefato
  # para teste no celular (não cria release nem publica atualização in-app).
  pull_request:
    branches:
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/build-rn-native.yml'

jobs:
  build:
    name: 📱 Build React Native Nativo
    runs-on: ubuntu-latest
    permissions:
      contents: write   # criar a GitHub Release com o APK
      id-token: write   # token OIDC que autoriza a publicação in-app na API (sem segredo)
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O padrão da action é "tools platform-tools", mas o pacote legado "tools"
          # foi removido do repositório do Google e o sdkmanager falha com exit code 1.
          # Platforms/build-tools são baixados pelo Gradle durante o build.
          packages: 'platform-tools'

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Install dependencies
        working-directory: ./mobile
        run: |
          echo "📦 Instalando dependências React Native 0.74.5..."
          npm ci --legacy-peer-deps
          
          echo "✅ Dependências instaladas com sucesso!"

      - name: 🔑 Setup Release Keystore
        if: github.event.inputs.build_type == 'release' || github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: ./mobile/android/app
        run: |
          # NUNCA gerar keystore novo a cada build — isso muda a assinatura e o Android
          # recusa a atualização com INSTALL_FAILED_UPDATE_INCOMPATIBLE.
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "🔑 Restaurando keystore dos GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "✅ Keystore restaurado dos secrets"
          elif [ -f debug.keystore ]; then
            echo "🔑 Usando debug.keystore como assinatura estável (sideload)..."
            cp debug.keystore release.keystore
            echo "✅ release.keystore = debug.keystore (mesma assinatura em todo build)"
          else
            echo "❌ Nenhum keystore disponível (secret ANDROID_KEYSTORE_BASE64 ou debug.keystore)"
            exit 1
          fi

      - name: 📝 Configure local.properties
        working-directory: ./mobile/android
        run: |
          echo "📝 Criando local.properties com SDK location..."
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "✅ local.properties criado!"
          
      - name: Instalar sharp e atualizar ícone do launcher (se API retornar imagem)
        working-directory: ./mobile
        run: |
          npm install sharp@0.33.5 --no-save --legacy-peer-deps
          node scripts/update-app-icon.js || echo "⚠️ Launcher: mantendo mipmaps do repositório"
        env:
          API_BASE_URL: https://nova-versao-liga-do-bem.vercel.app

      - name: 🖼️ Atualizar Assets do App (Logo e Ícone)
        working-directory: ./mobile
        run: |
          echo "🖼️ Baixando logo e ícone do app com configurações do admin..."
          node scripts/update-app-assets.js || echo "⚠️ Script de assets falhou, usando assets padrão"
        env:
          API_BASE_URL: https://nova-versao-liga-do-bem.vercel.app

      - name: 🏷 Ler versão do app
        id: app_version
        working-directory: ./mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versão do app: $VERSION"

      - name: 🏪 Versão do App Parceiros
        id: partner_app
        working-directory: ./mobile
        run: |
          PVERSION=$(node -p "require('./partner-app.json').version")
          PCODE=$(node -p "require('./partner-app.json').versionCode")
          PKG=$(node -p "require('./partner-app.json').applicationId")
          echo "version=$PVERSION" >> $GITHUB_OUTPUT
          echo "versionCode=$PCODE" >> $GITHUB_OUTPUT
          # O App Parceiros só compila quando o Firebase conhece o pacote dele
          # (google-services.json com um client para com.ligadobem.parceiros).
          if node -e "const g=require('./android/app/google-services.json');process.exit(g.client.some(c=>c.client_info.android_client_info.package_name==='$PKG')?0:1)"; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "🏪 App Parceiros v$PVERSION (code $PCODE) será gerado"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::App Parceiros NÃO gerado: registre o app $PKG no Firebase e atualize mobile/android/app/google-services.json."
          fi

      - name: 🏗️ Build APK
        working-directory: ./mobile
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          PVERSION="${{ steps.partner_app.outputs.version }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "release" ]; then T=Release; t=release; SUFFIX=""; else T=Debug; t=debug; SUFFIX="-debug"; fi

          # Dois apps no mesmo código (product flavors): member = Liga do Bem, partner = Liga do Bem Parceiros
          TASKS="assembleMember${T}"
          if [ "${{ steps.partner_app.outputs.enabled }}" = "true" ]; then TASKS="$TASKS assemblePartner${T}"; fi

          cd android
          chmod +x gradlew
          ./gradlew clean || echo "⚠️ Clean falhou, continuando..."
          echo "🏗️ ./gradlew $TASKS"
          ./gradlew $TASKS --no-daemon --stacktrace || { find app/build/outputs -name "*.apk"; exit 1; }

          MEMBER_APK="app/build/outputs/apk/member/${t}/app-member-${t}.apk"
          [ -f "$MEMBER_APK" ] || { echo "❌ APK do membro não gerado"; find app/build/outputs -name "*.apk"; exit 1; }
          cp "$MEMBER_APK" "../../liga-do-bem-botucatu-v${VERSION}${SUFFIX}.apk"

          if [ "${{ steps.partner_app.outputs.enabled }}" = "true" ]; then
            PARTNER_APK="app/build/outputs/apk/partner/${t}/app-partner-${t}.apk"
            [ -f "$PARTNER_APK" ] || { echo "❌ APK do App Parceiros não gerado"; find app/build/outputs -name "*.apk"; exit 1; }
            cp "$PARTNER_APK" "../../liga-do-bem-parceiros-v${PVERSION}${SUFFIX}.apk"
          fi

          echo "📦 APKs gerados:"
          ls -lh ../../liga-do-bem-*.apk

      - name: 📦 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: liga-do-bem-apk-v${{ steps.app_version.outputs.version }}-build-${{ github.run_number }}
          path: |
            liga-do-bem-*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🎉 Create GitHub Release
        if: (github.event_name == 'push' || github.event.inputs.build_type == 'release') && success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.app_version.outputs.version }}-build-${{ github.run_number }}
          name: Liga do Bem v${{ steps.app_version.outputs.version }} Build ${{ github.run_number }}
          body: |
            ## 📱 Liga do Bem Botucatu - v${{ steps.app_version.outputs.version }}
            
            ### ✨ Build Info
            - **Versão**: ${{ steps.app_version.outputs.version }}
            - **Build**: ${{ github.run_number }}
            - **Método**: React Native 0.74.5 Nativo
            - **Branch**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}
            
            ### ⬇️ Download:
            Baixe o APK abaixo e instale no seu dispositivo Android.
            - `liga-do-bem-botucatu-*.apk`: app dos membros
            - `liga-do-bem-parceiros-*.apk`: App Liga do Bem Parceiros (empresas parceiras)
            
            **Android mínimo:** 6.0 (API 23)
          draft: false
          prerelease: false
          files: |
            liga-do-bem-*.apk

      - name: 📊 Build Summary
        if: always()
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          echo "## 🎯 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: React Native 0.74.5 Nativo" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "liga-do-bem-botucatu-v${VERSION}.apk" ]; then
            APK_SIZE=$(du -h "liga-do-bem-botucatu-v${VERSION}.apk" | cut -f1)
            echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **APK v${VERSION} gerado!**" >> $GITHUB_STEP_SUMMARY
          elif [ -f "liga-do-bem-botucatu-v${VERSION}-debug.apk" ]; then
            APK_SIZE=$(du -h "liga-do-bem-botucatu-v${VERSION}-debug.apk" | cut -f1)
            echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Debug APK v${VERSION} gerado!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build falhou**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📲 Publicar versão no app (update in-app)
        if: success() && (github.event_name == 'push' || github.event.inputs.build_type == 'release')
        env:
          CI_APP_PUBLISH_TOKEN: ${{ secrets.CI_APP_PUBLISH_TOKEN }}
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          VERSION_CODE=$(grep -E 'versionCode\s+[0-9]+' mobile/android/app/build.gradle | head -1 | grep -oE '[0-9]+' | head -1)
          RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/v${VERSION}-build-${{ github.run_number }}"

          # Autenticação: token OIDC do GitHub (assinado pelo GitHub, vale só para este repo/branch).
          # O secret CI_APP_PUBLISH_TOKEN continua aceito, mas não é mais necessário.
          AUTH_HEADER=""
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=liga-do-bem-app-publish" | jq -r '.value // empty')
            [ -n "$OIDC_TOKEN" ] && AUTH_HEADER="X-GitHub-OIDC: ${OIDC_TOKEN}"
          fi
          if [ -z "$AUTH_HEADER" ] && [ -n "$CI_APP_PUBLISH_TOKEN" ]; then
            AUTH_HEADER="X-CI-Token: ${CI_APP_PUBLISH_TOKEN}"
          fi
          if [ -z "$AUTH_HEADER" ]; then
            echo "::error::Sem credencial para publicar (OIDC indisponível e sem CI_APP_PUBLISH_TOKEN)."
            exit 1
          fi

          # publish <canal> <versão> <versionCode> <arquivo>
          publish() {
            local PLATFORM="$1" V="$2" CODE="$3" FILE="$4"
            local BYTES=0
            [ -f "$FILE" ] && BYTES=$(wc -c < "$FILE" | tr -d ' ')
            local PAYLOAD
            PAYLOAD=$(jq -n \
              --arg version "$V" --argjson versionCode "$CODE" \
              --arg apkUrl "${RELEASE_BASE}/${FILE}" --argjson apkSize "$BYTES" \
              --arg notes "Build ${{ github.run_number }} — commit ${GITHUB_SHA}" --arg platform "$PLATFORM" \
              '{version: $version, versionCode: $versionCode, apkUrl: $apkUrl, apkSize: $apkSize,
                releaseNotes: $notes, isMandatory: false, platform: $platform}')
            echo "📦 [$PLATFORM] v${V} (code ${CODE}) → ${RELEASE_BASE}/${FILE}"
            local HTTP_CODE
            HTTP_CODE=$(curl -sS -o publish-response.json -w '%{http_code}' -X POST \
              "https://nova-versao-liga-do-bem.vercel.app/api/app/versions/publish" \
              -H "Content-Type: application/json" -H "$AUTH_HEADER" -d "$PAYLOAD")
            cat publish-response.json; echo
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Publicação in-app [$PLATFORM] falhou (HTTP $HTTP_CODE). Os usuários NÃO vão receber a v${V}."
              return 1
            fi
            echo "✅ [$PLATFORM] v${V} publicada: o app vai oferecer a atualização." >> $GITHUB_STEP_SUMMARY
          }

          publish android "$VERSION" "$VERSION_CODE" "liga-do-bem-botucatu-v${VERSION}.apk"
          if [ "${{ steps.partner_app.outputs.enabled }}" = "true" ]; then
            publish android-partner "${{ steps.partner_app.outputs.version }}" "${{ steps.partner_app.outputs.versionCode }}" \
              "liga-do-bem-parceiros-v${{ steps.partner_app.outputs.version }}.apk"
          fi
