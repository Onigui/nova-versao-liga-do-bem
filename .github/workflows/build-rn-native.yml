name: 🚀 Build APK React Native 0.74.5 Nativo (100% Gratuito)

# Workflow restaurado e funcionando - dispara sempre no push

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - master
      - main
    # Sempre dispara no push - remove restrição de paths para garantir builds

jobs:
  build:
    name: 📱 Build React Native Nativo
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Install dependencies
        working-directory: ./mobile
        run: |
          echo "📦 Instalando dependências React Native 0.74.5..."
          npm ci --legacy-peer-deps
          
          echo "✅ Dependências instaladas com sucesso!"

      - name: 🔑 Setup Release Keystore
        if: github.event.inputs.build_type == 'release' || github.event_name == 'push'
        working-directory: ./mobile/android/app
        run: |
          echo "🔑 Criando keystore para assinatura..."
          
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore release.keystore \
            -alias ligadobem \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Liga do Bem, OU=Mobile, O=Liga do Bem Botucatu, L=Botucatu, ST=SP, C=BR"
          
          echo "✅ Keystore criado!"

      - name: 📝 Configure local.properties
        working-directory: ./mobile/android
        run: |
          echo "📝 Criando local.properties com SDK location..."
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "✅ local.properties criado!"
          
      - name: Instalar sharp e atualizar ícone do launcher (se API retornar imagem)
        working-directory: ./mobile
        run: |
          npm install sharp@0.33.5 --no-save --legacy-peer-deps
          node scripts/update-app-icon.js || echo "⚠️ Launcher: mantendo mipmaps do repositório"
        env:
          API_BASE_URL: https://nova-versao-liga-do-bem.vercel.app

      - name: 🖼️ Atualizar Assets do App (Logo e Ícone)
        working-directory: ./mobile
        run: |
          echo "🖼️ Baixando logo e ícone do app com configurações do admin..."
          node scripts/update-app-assets.js || echo "⚠️ Script de assets falhou, usando assets padrão"
        env:
          API_BASE_URL: https://nova-versao-liga-do-bem.vercel.app

      - name: 🏷 Ler versão do app
        id: app_version
        working-directory: ./mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versão do app: $VERSION"

      - name: 🏗️ Build APK
        working-directory: ./mobile
        run: |
          echo "🏗️ Iniciando build React Native 0.74.5 nativo..."
          VERSION="${{ steps.app_version.outputs.version }}"
          
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "📦 Building RELEASE APK v${VERSION}..."
            
            # Build release com Gradle
            cd android
            chmod +x gradlew
            
            # Limpar build anterior (opcional, mas ajuda em alguns casos)
            ./gradlew clean || echo "⚠️ Clean falhou, continuando..."
            
            # Build release
            ./gradlew assembleRelease --no-daemon --stacktrace --info || {
              echo "❌ Build falhou! Verificando logs..."
              cat app/build/outputs/apk/release/output.json 2>/dev/null || echo "Nenhum log disponível"
              exit 1
            }
            
            # Verificar se o APK foi gerado
            if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
              echo "❌ APK não foi gerado! Listando arquivos de saída:"
              find app/build/outputs -name "*.apk" 2>/dev/null || echo "Nenhum APK encontrado"
              exit 1
            fi
            
            # Copiar APK
            cp app/build/outputs/apk/release/app-release.apk "../../liga-do-bem-botucatu-v${VERSION}.apk"
            echo "✅ Release APK built successfully!"
          else
            echo "🐛 Building DEBUG APK v${VERSION}..."
            
            # Build debug
            cd android
            chmod +x gradlew
            
            # Limpar build anterior
            ./gradlew clean || echo "⚠️ Clean falhou, continuando..."
            
            # Build debug
            ./gradlew assembleDebug --no-daemon --stacktrace --info || {
              echo "❌ Build falhou! Verificando logs..."
              cat app/build/outputs/apk/debug/output.json 2>/dev/null || echo "Nenhum log disponível"
              exit 1
            }
            
            # Verificar se o APK foi gerado
            if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "❌ APK não foi gerado! Listando arquivos de saída:"
              find app/build/outputs -name "*.apk" 2>/dev/null || echo "Nenhum APK encontrado"
              exit 1
            fi
            
            # Copiar APK
            cp app/build/outputs/apk/debug/app-debug.apk "../../liga-do-bem-botucatu-v${VERSION}-debug.apk"
            echo "✅ Debug APK built successfully!"
          fi
          
          echo "📦 APK gerado!"
          ls -lh ../../liga-do-bem-botucatu*.apk

      - name: 📦 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: liga-do-bem-apk-v${{ steps.app_version.outputs.version }}-build-${{ github.run_number }}
          path: |
            liga-do-bem-botucatu*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🎉 Create GitHub Release
        if: (github.event_name == 'push' || github.event.inputs.build_type == 'release') && success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.app_version.outputs.version }}-build-${{ github.run_number }}
          name: Liga do Bem v${{ steps.app_version.outputs.version }} Build ${{ github.run_number }}
          body: |
            ## 📱 Liga do Bem Botucatu - v${{ steps.app_version.outputs.version }}
            
            ### ✨ Build Info
            - **Versão**: ${{ steps.app_version.outputs.version }}
            - **Build**: ${{ github.run_number }}
            - **Método**: React Native 0.74.5 Nativo
            - **Branch**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}
            
            ### ⬇️ Download:
            Baixe o APK abaixo e instale no seu dispositivo Android.
            
            **Android mínimo:** 6.0 (API 23)
          draft: false
          prerelease: false
          files: |
            liga-do-bem-botucatu*.apk

      - name: 📊 Build Summary
        if: always()
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          echo "## 🎯 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: React Native 0.74.5 Nativo" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "liga-do-bem-botucatu-v${VERSION}.apk" ]; then
            APK_SIZE=$(du -h "liga-do-bem-botucatu-v${VERSION}.apk" | cut -f1)
            echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **APK v${VERSION} gerado!**" >> $GITHUB_STEP_SUMMARY
          elif [ -f "liga-do-bem-botucatu-v${VERSION}-debug.apk" ]; then
            APK_SIZE=$(du -h "liga-do-bem-botucatu-v${VERSION}-debug.apk" | cut -f1)
            echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Debug APK v${VERSION} gerado!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build falhou**" >> $GITHUB_STEP_SUMMARY
          fi
